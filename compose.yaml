services:
  api:
    build: .
    ports: 
      - "8000:8000"
    environment:
      # Notice it says "@db:5432" instead of "@localhost:5432"
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks
    depends_on: 
      - db
      
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    volumes: 
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: